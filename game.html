<title>Simit Yağmuru</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@500;600&display=swap">
<style>
/* Layout: HUD strip on top, one full-height canvas stage below; menu and result cards float over the stage.
   Look: Bosphorus light changing from morning to night, sesame gold and crust orange, burnt brown as the hazard. Single dark UI by choice. */
:root {
  --sky-top: #0d2238;
  --sesame: #e8b04a;
  --crust: #c9772b;
  --burnt: #2b1a14;
  --ember: #ff6a45;
  --ink: #f6ecda;
  --ink-dim: #a9b9c4;
  --panel: rgba(9, 22, 35, 0.88);
  --line: rgba(232, 176, 74, 0.35);
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky-top);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.hud { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; min-width: 0; }
.hud-block { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hud-block.right { align-items: flex-end; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); }
.score { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.best { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--sesame); }
.mid { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.lives { display: flex; gap: 6px; }
.life { width: 18px; height: 18px; border-radius: 50%; border: 5px solid var(--sesame); box-sizing: border-box; transition: opacity .2s, border-color .2s; }
.life.lost { border-color: #4b5b66; opacity: .55; }
.combo { font-family: var(--font-display); font-weight: 800; font-size: 13px; letter-spacing: .06em; color: var(--ember); min-height: 16px; }

.stage { position: relative; flex: 1; min-height: 0; border-radius: 18px; overflow: hidden; background: var(--sky-top); }
canvas#c { display: block; width: 100%; height: 100%; touch-action: none; }

.topbar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; align-items: center; gap: 10px; pointer-events: none; }
.topbar[hidden] { display: none; }
.prog { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.prog span { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); text-shadow: 0 1px 3px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 6px; border-radius: 3px; background: rgba(0,0,0,.35); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--sesame); border-radius: 3px; transition: width .15s; }
.bar.off { visibility: hidden; }

.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(7, 17, 28, 0.6); }
.overlay[hidden] { display: none; }
.card {
  width: 100%; max-width: 360px; max-height: 100%; overflow-y: auto; box-sizing: border-box;
  background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 22px 20px;
  display: flex; flex-direction: column; gap: 14px;
}
.card h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; text-wrap: balance; color: var(--sesame); }
.card p { margin: 0; line-height: 1.45; }
.rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; padding: 0; list-style: none; }
.rules li { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: 12px; line-height: 1.25; color: var(--ink-dim); }
.rules canvas.icon { width: 34px; height: 34px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.lvbtn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 0; min-height: 62px; font-size: 22px;
  background: rgba(246, 236, 218, 0.1); color: var(--ink); border: 1px solid var(--line);
}
.lvbtn:active { background: rgba(246, 236, 218, 0.2); }
.lvbtn:disabled { opacity: .4; cursor: default; }
.mini-stars { display: flex; gap: 2px; }
.st { display: inline-block; width: 11px; height: 11px; background: #4b5b66; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.st.on { background: var(--sesame); }
.big-stars { display: flex; gap: 8px; justify-content: center; }
.big-stars .st { width: 40px; height: 40px; }
.final { font-family: var(--font-display); font-weight: 800; font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums; }
.btns { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }

button {
  font: inherit; font-family: var(--font-display); font-weight: 800; font-size: 18px;
  color: #2a1608; background: var(--sesame); border: 0; border-radius: 14px; padding: 13px 18px; cursor: pointer; min-height: 48px;
}
button:active { transform: translateY(1px); background: #d79d38; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
button.ghost { background: transparent; color: var(--sesame); border: 2px solid var(--line); padding: 11px 16px; }
button.ghost:active { background: rgba(232, 176, 74, 0.15); }
button.mini { pointer-events: auto; font-size: 13px; min-height: 36px; padding: 8px 14px; color: var(--ink); background: rgba(9, 22, 35, 0.7); border: 1px solid var(--line); }
.newbest { color: var(--ember); font-weight: 600; }
.center { text-align: center; }
</style>

<div class="hud">
  <div class="hud-block">
    <span class="label">Puan</span>
    <span class="score" id="score">0</span>
  </div>
  <div class="mid">
    <div class="lives" id="lives" aria-label="Kalan can">
      <span class="life"></span><span class="life"></span><span class="life"></span>
    </div>
    <div class="combo" id="combo"></div>
  </div>
  <div class="hud-block right">
    <span class="label" id="rightLabel">En iyi</span>
    <span class="best" id="rightVal">0</span>
  </div>
</div>

<div class="stage" id="stage">
  <canvas id="c" aria-label="Oyun alanı"></canvas>

  <div class="topbar" id="topbar" hidden>
    <button class="mini" id="menuBtn" type="button">Menü</button>
    <div class="prog"><span id="lvname"></span><div class="bar" id="bar"><i id="barfill"></i></div></div>
  </div>

  <div class="overlay" id="menu">
    <div class="card">
      <h1>Simit Yağmuru</h1>
      <p>Parmağını kaydırarak tepsiyi taşı, düşen simitleri yakala.</p>
      <ul class="rules">
        <li><canvas class="icon" data-kind="normal" width="68" height="68"></canvas><span>1 puan, art arda yakalarsan çarpan artar</span></li>
        <li><canvas class="icon" data-kind="gold" width="68" height="68"></canvas><span>Altın simit 5 puan</span></li>
        <li><canvas class="icon" data-kind="burnt" width="68" height="68"></canvas><span>Yanık simit bir can götürür</span></li>
      </ul>
      <span class="label">Bölümler</span>
      <div class="grid" id="grid"></div>
      <div class="row">
        <button id="endlessBtn" class="ghost" type="button">Sonsuz mod</button>
        <button id="soundBtn" class="ghost" type="button">Ses: açık</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="result" hidden>
    <div class="card center">
      <span class="label" id="rlabel"></span>
      <h1 id="rtitle"></h1>
      <div class="big-stars" id="rstars"></div>
      <div class="final" id="final">0</div>
      <p id="rmsg"></p>
      <div class="btns" id="rbtns"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var LEVELS = [
    { name: 'Sabah Vapuru',     goal: 15,  speed: 1.0,  burnt: 0.10, gold: 0.08, wind: 0,  gulls: false, fog: false, sky: ['#4f9fd3', '#98cfe6', '#f4dfb4'], sil: '#24445c', sun: true },
    { name: 'Karaköy İskelesi', goal: 25,  speed: 1.1,  burnt: 0.16, gold: 0.08, wind: 0,  gulls: false, fog: false, sky: ['#3f8fc4', '#86c1de', '#f0cf9c'], sil: '#1f3d56', sun: true },
    { name: 'Galata Rüzgârı',   goal: 35,  speed: 1.15, burnt: 0.18, gold: 0.07, wind: 40, gulls: false, fog: false, sky: ['#2f6fa8', '#6aa6c8', '#e7c48f'], sil: '#1a354d', sun: true },
    { name: 'Kapalıçarşı',      goal: 45,  speed: 1.25, burnt: 0.22, gold: 0.07, wind: 0,  gulls: false, fog: false, sky: ['#2a1822', '#6e3338', '#c9772b'], sil: '#160b10', sun: false },
    { name: 'Martı Sürüsü',     goal: 55,  speed: 1.2,  burnt: 0.20, gold: 0.07, wind: 0,  gulls: true,  fog: false, sky: ['#2d7fb8', '#7fb7d6', '#f5e2bd'], sil: '#1d3d56', sun: true },
    { name: 'Sisli Akşam',      goal: 65,  speed: 1.3,  burnt: 0.22, gold: 0.07, wind: 0,  gulls: false, fog: true,  sky: ['#1c2f4d', '#4a5e7e', '#a58f8f'], sil: '#0d1b2b', moon: true },
    { name: 'Poyraz',           goal: 80,  speed: 1.4,  burnt: 0.24, gold: 0.07, wind: 75, gulls: false, fog: false, sky: ['#16283f', '#2a4a63', '#476f7f'], sil: '#0a1824', moon: true },
    { name: 'Büyük Final',      goal: 110, speed: 1.45, burnt: 0.27, gold: 0.07, wind: 55, gulls: true,  fog: true,  sky: ['#0d2238', '#25526b', '#3b6a7e'], sil: '#0a1c2c', moon: true }
  ];
  var ENDLESS = { name: 'Sonsuz mod', goal: 0, endless: true, speed: 1, wind: 0, gulls: false, fog: false, sky: ['#0d2238', '#25526b', '#3b6a7e'], sil: '#0a1c2c', moon: true };

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var $ = function (id) { return document.getElementById(id); };
  var elScore = $('score'), elCombo = $('combo'), rightLabel = $('rightLabel'), rightVal = $('rightVal');
  var elLives = Array.prototype.slice.call(document.querySelectorAll('#lives .life'));
  var menu = $('menu'), result = $('result'), topbar = $('topbar');

  /* ---------- saved progress ---------- */
  var SAVE_KEY = 'simit-save-v2';
  var save = { unlocked: 1, stars: [] };
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (raw) { var o = JSON.parse(raw); if (o && typeof o.unlocked === 'number' && Array.isArray(o.stars)) save = o; }
  } catch (e) {}
  while (save.stars.length < LEVELS.length) save.stars.push(0);
  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
  var best = 0;
  try { best = parseInt(localStorage.getItem('simit-best') || '0', 10) || 0; } catch (e) { best = 0; }

  /* ---------- sound ---------- */
  var audio = null, soundOn = true;
  try { soundOn = localStorage.getItem('simit-sound') !== 'off'; } catch (e) {}
  function ac() {
    if (!audio) { try { var C = window.AudioContext || window.webkitAudioContext; if (C) audio = new C(); } catch (e) {} }
    if (audio && audio.state === 'suspended') { try { audio.resume(); } catch (e) {} }
    return audio;
  }
  function tone(f, d, type, g, delay) {
    if (!soundOn) return;
    var a = ac(); if (!a) return;
    try {
      var t = a.currentTime + (delay || 0);
      var o = a.createOscillator(), v = a.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f, t);
      v.gain.setValueAtTime(g || 0.07, t);
      v.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(v); v.connect(a.destination);
      o.start(t); o.stop(t + d + 0.02);
    } catch (e) {}
  }

  /* ---------- game state ---------- */
  var W = 0, H = 0, dpr = 1;
  var state = 'menu';            // menu | play | over
  var lv = ENDLESS, lvIndex = -1;
  var score = 0, lives = 3, streak = 0, mult = 1, elapsed = 0, spawnT = 0, gullT = 6, flash = 0, last = 0;
  var items = [], parts = [], gulls = [], streaks = [];
  var tray = { x: 0, target: 0, w: 100, h: 14, y: 0 };
  var keys = { left: false, right: false };
  for (var s = 0; s < 8; s++) streaks.push({ x: Math.random(), y: Math.random(), len: 30 + Math.random() * 50 });

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function resize() {
    var r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildSprites();
    tray.w = clamp(W * 0.27, 80, 124);
    tray.y = H - 46;
    tray.x = clamp(tray.x || W / 2, tray.w / 2, W - tray.w / 2);
    tray.target = tray.x;
  }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ---------- drawing ---------- */
  function drawSimit(c, x, y, r, kind, rot) {
    c.save();
    c.translate(x, y);
    if (kind === 'gold') { c.shadowColor = 'rgba(255, 214, 110, 0.9)'; c.shadowBlur = r * 0.9; }
    if (kind === 'burnt') { c.shadowColor = 'rgba(255, 90, 50, 0.55)'; c.shadowBlur = r * 0.6; }
    var base = kind === 'gold' ? '#f5c44e' : kind === 'burnt' ? '#2b1a14' : '#c9772b';
    var hi = kind === 'gold' ? '#fff0b0' : kind === 'burnt' ? '#6a3418' : '#e9a24f';
    c.beginPath(); c.arc(0, 0, r * 0.78, 0, Math.PI * 2);
    c.lineWidth = r * 0.64; c.strokeStyle = base; c.stroke();
    c.shadowBlur = 0;
    c.beginPath(); c.arc(0, 0, r * 0.78, Math.PI * 1.1, Math.PI * 1.75);
    c.lineWidth = r * 0.16; c.lineCap = 'round'; c.strokeStyle = hi; c.stroke();
    if (kind !== 'burnt') {
      c.fillStyle = '#fbeec4';
      for (var i = 0; i < 12; i++) {
        var a = rot + i * (Math.PI * 2 / 12) + (i % 2) * 0.12;
        var rr = r * (0.78 + ((i % 3) - 1) * 0.12);
        c.beginPath();
        c.ellipse(Math.cos(a) * rr, Math.sin(a) * rr, r * 0.075, r * 0.045, a, 0, Math.PI * 2);
        c.fill();
      }
    } else {
      c.fillStyle = '#14090a';
      for (var j = 0; j < 7; j++) {
        var b = rot + j * 0.9;
        c.beginPath(); c.arc(Math.cos(b) * r * 0.78, Math.sin(b) * r * 0.78, r * 0.07, 0, Math.PI * 2); c.fill();
      }
    }
    c.restore();
  }
  Array.prototype.forEach.call(document.querySelectorAll('canvas.icon'), function (ic) {
    drawSimit(ic.getContext('2d'), 34, 34, 22, ic.getAttribute('data-kind'), 0.4);
  });

  /* Oyundaki simitler: golge/parlama efekti kullanmadan, bir kez cizilip tekrar tekrar basilan gorseller */
  var sprites = {};
  function makeSprite(kind) {
    var R = 20, pad = Math.ceil(R * 1.9), size = pad * 2;
    var cn = document.createElement('canvas');
    cn.width = Math.round(size * dpr); cn.height = Math.round(size * dpr);
    var c = cn.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.translate(pad, pad);
    if (kind !== 'normal') {
      var gc = kind === 'gold' ? '255, 214, 110' : '255, 90, 50';
      var ga = kind === 'gold' ? 0.14 : 0.09;
      for (var k = 3; k >= 1; k--) {
        c.beginPath(); c.arc(0, 0, R * 0.78, 0, Math.PI * 2);
        c.lineWidth = R * 0.64 + R * 0.2 * k;
        c.strokeStyle = 'rgba(' + gc + ', ' + ga + ')';
        c.stroke();
      }
    }
    var base = kind === 'gold' ? '#f5c44e' : kind === 'burnt' ? '#2b1a14' : '#c9772b';
    var hi = kind === 'gold' ? '#fff0b0' : kind === 'burnt' ? '#6a3418' : '#e9a24f';
    c.lineCap = 'round';
    c.beginPath(); c.arc(0, 0, R * 0.78, 0, Math.PI * 2);
    c.lineWidth = R * 0.64; c.strokeStyle = base; c.stroke();
    c.beginPath(); c.arc(0, 0, R * 0.78, Math.PI * 1.1, Math.PI * 1.75);
    c.lineWidth = R * 0.16; c.strokeStyle = hi; c.stroke();
    if (kind !== 'burnt') {
      c.strokeStyle = '#fbeec4'; c.lineWidth = R * 0.09;
      for (var i = 0; i < 12; i++) {
        var a = 0.4 + i * (Math.PI * 2 / 12) + (i % 2) * 0.12;
        var rr = R * (0.78 + ((i % 3) - 1) * 0.12);
        var x = Math.cos(a) * rr, y = Math.sin(a) * rr;
        var tx = -Math.sin(a) * R * 0.05, ty = Math.cos(a) * R * 0.05;
        c.beginPath(); c.moveTo(x - tx, y - ty); c.lineTo(x + tx, y + ty); c.stroke();
      }
    } else {
      c.fillStyle = '#14090a';
      for (var j = 0; j < 7; j++) {
        var b = 0.4 + j * 0.9;
        c.beginPath(); c.arc(Math.cos(b) * R * 0.78, Math.sin(b) * R * 0.78, R * 0.07, 0, Math.PI * 2); c.fill();
      }
    }
    return { cv: cn, pad: pad, size: size };
  }
  function buildSprites() {
    sprites = { normal: makeSprite('normal'), gold: makeSprite('gold'), burnt: makeSprite('burnt') };
  }
  function drawRing(x, y, r, kind, rot) {
    var sp = sprites[kind];
    if (!sp) return;
    var k = r / 20;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(k, k);
    ctx.drawImage(sp.cv, -sp.pad, -sp.pad, sp.size, sp.size);
    ctx.restore();
  }

  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, lv.sky[0]); g.addColorStop(0.7, lv.sky[1]); g.addColorStop(1, lv.sky[2]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    if (lv.sun) {
      ctx.save();
      ctx.shadowColor = 'rgba(255, 240, 190, 0.9)'; ctx.shadowBlur = 30;
      ctx.fillStyle = '#fff3c4';
      ctx.beginPath(); ctx.arc(W * 0.8, H * 0.15, 19, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (lv.moon) {
      ctx.fillStyle = 'rgba(246, 236, 218, 0.92)';
      ctx.beginPath(); ctx.arc(W * 0.82, H * 0.14, 15, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = lv.sky[0];
      ctx.beginPath(); ctx.arc(W * 0.82 + 7, H * 0.14 - 3, 13, 0, Math.PI * 2); ctx.fill();
    }

    var base = H - 24;
    ctx.fillStyle = lv.sil;
    var mx = W * 0.3;
    ctx.fillRect(mx - 62, base - 46, 124, 46);
    ctx.beginPath(); ctx.arc(mx, base - 46, 40, Math.PI, 0); ctx.fill();
    ctx.fillRect(mx - 1.5, base - 100, 3, 14);
    [-86, 86].forEach(function (dx) {
      ctx.fillRect(mx + dx - 4, base - 120, 8, 120);
      ctx.beginPath();
      ctx.moveTo(mx + dx - 6, base - 120); ctx.lineTo(mx + dx, base - 144); ctx.lineTo(mx + dx + 6, base - 120);
      ctx.closePath(); ctx.fill();
    });
    ctx.fillRect(W * 0.58, base - 34, 46, 34);
    ctx.fillRect(W * 0.7, base - 52, 34, 52);
    ctx.fillRect(W * 0.8, base - 28, 60, 28);
    ctx.fillRect(0, base, W, 24);
    ctx.fillStyle = 'rgba(232, 176, 74, 0.5)';
    [W * 0.58 + 10, W * 0.7 + 8, W * 0.7 + 20, W * 0.8 + 14, W * 0.8 + 38].forEach(function (wx, i) {
      ctx.fillRect(wx, base - 20 - (i % 2) * 14, 4, 5);
    });
  }

  function windNow() { return lv.wind ? Math.sin(elapsed * 0.45) * lv.wind : 0; }

  function drawWind() {
    var w = windNow();
    if (!lv.wind) return;
    var a = Math.min(0.4, Math.abs(w) / 160);
    ctx.strokeStyle = 'rgba(255,255,255,' + a + ')';
    ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (var i = 0; i < streaks.length; i++) {
      var s = streaks[i];
      var x = s.x * W, y = 50 + s.y * (H - 140);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.sign(w) * s.len, y); ctx.stroke();
    }
  }

  function drawGull(g) {
    var w = 20, flap = Math.sin(g.t * 11) * 9;
    ctx.strokeStyle = '#f7f4ec'; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(g.x - w, g.y + flap * 0.3);
    ctx.quadraticCurveTo(g.x - w / 2, g.y - 7 - flap, g.x, g.y);
    ctx.quadraticCurveTo(g.x + w / 2, g.y - 7 - flap, g.x + w, g.y + flap * 0.3);
    ctx.stroke();
  }

  function drawTray() {
    var x = tray.x - tray.w / 2, y = tray.y;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
    ctx.fillStyle = '#b5c0c7';
    roundRect(x, y, tray.w, tray.h, 7); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#e2e9ed'; roundRect(x + 4, y + 2, tray.w - 8, 4, 2); ctx.fill();
    ctx.fillStyle = '#8c98a0'; roundRect(x + 10, y + tray.h - 3, tray.w - 20, 5, 2.5); ctx.fill();
  }

  function draw() {
    drawSky();
    drawWind();
    for (var i = 0; i < items.length; i++) { var it = items[i]; drawRing(it.x, it.y, it.r, it.kind, it.rot); }
    if (lv.fog) {
      var fa = 0.8 + Math.sin(elapsed * 0.8) * 0.1;
      var fg = ctx.createLinearGradient(0, 0, 0, H * 0.58);
      fg.addColorStop(0, 'rgba(176, 186, 200, ' + fa + ')');
      fg.addColorStop(1, 'rgba(176, 186, 200, 0)');
      ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H * 0.58);
    }
    for (var gi = 0; gi < gulls.length; gi++) drawGull(gulls[gi]);
    drawTray();
    for (var p = 0; p < parts.length; p++) {
      var q = parts[p];
      ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
      ctx.fillStyle = q.color;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (flash > 0) { ctx.fillStyle = 'rgba(255, 70, 40, ' + (flash * 0.35) + ')'; ctx.fillRect(0, 0, W, H); }
  }

  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = rand(0, Math.PI * 2), sp = rand(40, 170);
      parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, s: rand(1.5, 3.2), life: 0.5, max: 0.5, color: color });
    }
  }

  /* ---------- hud ---------- */
  function setScore(v) {
    score = v; elScore.textContent = v;
    if (lv.goal) $('barfill').style.width = Math.min(100, score / lv.goal * 100) + '%';
  }
  function setCombo() { elCombo.textContent = mult > 1 ? 'Çarpan x' + mult : ''; }
  function setLives() { elLives.forEach(function (el, i) { el.classList.toggle('lost', i >= lives); }); }
  function starsHtml(n, cls) {
    var h = '';
    for (var i = 0; i < 3; i++) h += '<span class="st' + (i < n ? ' on' : '') + '"></span>';
    return h;
  }

  /* ---------- screens ---------- */
  function showMenu() {
    state = 'menu';
    items = []; parts = []; gulls = []; lv = ENDLESS; elapsed = 0; flash = 0;
    topbar.hidden = true; result.hidden = true; menu.hidden = false;
    rightLabel.textContent = 'En iyi'; rightVal.textContent = best;
    setScore(0); lives = 3; setLives(); mult = 1; setCombo();
    var grid = $('grid');
    grid.innerHTML = '';
    LEVELS.forEach(function (L, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'lvbtn';
      b.setAttribute('aria-label', 'Bölüm ' + (i + 1) + ': ' + L.name);
      var locked = i >= save.unlocked;
      b.disabled = locked;
      b.innerHTML = '<span>' + (i + 1) + '</span><span class="mini-stars">' + starsHtml(save.stars[i] || 0) + '</span>';
      b.addEventListener('click', function () { ac(); startLevel(i); });
      grid.appendChild(b);
    });
    $('soundBtn').textContent = 'Ses: ' + (soundOn ? 'açık' : 'kapalı');
  }

  function resetRun() {
    items = []; parts = []; gulls = [];
    lives = 3; streak = 0; mult = 1; elapsed = 0; spawnT = 0.3; gullT = 5; flash = 0;
    setScore(0); setLives(); setCombo();
    menu.hidden = true; result.hidden = true;
    topbar.hidden = false;
    $('lvname').textContent = lv.endless ? lv.name : 'Bölüm ' + (lvIndex + 1) + ' · ' + lv.name;
    $('bar').classList.toggle('off', !!lv.endless);
    $('barfill').style.width = '0%';
    if (lv.endless) { rightLabel.textContent = 'En iyi'; rightVal.textContent = best; }
    else { rightLabel.textContent = 'Hedef'; rightVal.textContent = lv.goal; }
    state = 'play';
  }
  function startLevel(i) { lvIndex = i; lv = LEVELS[i]; resetRun(); }
  function startEndless() { lvIndex = -1; lv = ENDLESS; resetRun(); }

  function showResult(o) {
    state = 'over';
    $('rlabel').textContent = o.label;
    $('rtitle').textContent = o.title;
    var st = $('rstars');
    st.hidden = o.stars === null;
    st.innerHTML = o.stars === null ? '' : starsHtml(o.stars);
    $('final').textContent = score;
    $('rmsg').innerHTML = o.msg;
    var bx = $('rbtns'); bx.innerHTML = '';
    o.buttons.forEach(function (bt) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = bt.text;
      if (bt.ghost) b.className = 'ghost';
      b.addEventListener('click', bt.fn);
      bx.appendChild(b);
    });
    topbar.hidden = true;
    result.hidden = false;
  }

  function winLevel() {
    var n = Math.max(1, lives);
    save.stars[lvIndex] = Math.max(save.stars[lvIndex] || 0, n);
    var hasNext = lvIndex + 1 < LEVELS.length;
    if (hasNext) save.unlocked = Math.max(save.unlocked, lvIndex + 2);
    persist();
    tone(523, 0.18, 'triangle', 0.09); tone(659, 0.18, 'triangle', 0.09, 0.15); tone(784, 0.35, 'triangle', 0.09, 0.3);
    var idx = lvIndex;
    var btns = [];
    if (hasNext) btns.push({ text: 'Sonraki bölüm', fn: function () { startLevel(idx + 1); } });
    btns.push({ text: 'Tekrar oyna', ghost: true, fn: function () { startLevel(idx); } });
    btns.push({ text: 'Menü', ghost: true, fn: showMenu });
    showResult({
      label: 'Bölüm ' + (idx + 1) + ' tamam', title: lv.name, stars: n,
      msg: hasNext ? 'Sıradaki bölüm açıldı. Daha az can kaybedersen daha çok yıldız alırsın.' : 'Tüm bölümleri bitirdin. Şimdi sonsuz modda rekor kırmayı dene.',
      buttons: btns
    });
  }

  function loseLevel() {
    tone(330, 0.2, 'sawtooth', 0.06); tone(220, 0.35, 'sawtooth', 0.06, 0.18);
    var idx = lvIndex;
    showResult({
      label: 'Olmadı', title: lv.name, stars: null,
      msg: 'Hedef ' + lv.goal + ' puandı. Yanık simitlerden kaçıp tekrar dene.',
      buttons: [
        { text: 'Tekrar dene', fn: function () { startLevel(idx); } },
        { text: 'Menü', ghost: true, fn: showMenu }
      ]
    });
  }

  function endEndless() {
    var isBest = score > best;
    if (isBest) { best = score; try { localStorage.setItem('simit-best', String(best)); } catch (e) {} }
    tone(330, 0.2, 'sawtooth', 0.06); tone(220, 0.35, 'sawtooth', 0.06, 0.18);
    showResult({
      label: 'Oyun bitti', title: 'Sonsuz mod', stars: null,
      msg: isBest && score > 0 ? '<span class="newbest">Yeni rekor.</span> Bir tur daha deneyip geçebilir misin?' : 'En iyi puanın ' + best + '. Bir tur daha dene.',
      buttons: [
        { text: 'Tekrar oyna', fn: startEndless },
        { text: 'Menü', ghost: true, fn: showMenu }
      ]
    });
  }

  /* ---------- simulation ---------- */
  function spawn() {
    var burntP, speed;
    if (lv.endless) {
      burntP = 0.17 + Math.min(0.16, elapsed * 0.003);
      speed = Math.min(150 + elapsed * 4.2 + rand(0, 70), 430);
    } else {
      burntP = lv.burnt;
      speed = Math.min((170 + elapsed * 2 + rand(0, 60)) * lv.speed, 440);
    }
    var goldP = lv.gold || 0.07;
    var roll = Math.random();
    var kind = roll < burntP ? 'burnt' : roll < burntP + goldP ? 'gold' : 'normal';
    var r = rand(15, 19);
    items.push({ x: rand(r + 6, W - r - 6), y: -r - 4, r: r, vy: speed * clamp(H / 600, 0.8, 1.3), kind: kind, rot: rand(0, 6), spin: rand(-2, 2) });
  }

  function update(dt) {
    if (keys.left) tray.target -= 520 * dt;
    if (keys.right) tray.target += 520 * dt;
    tray.target = clamp(tray.target, tray.w / 2, W - tray.w / 2);
    tray.x += (tray.target - tray.x) * Math.min(1, dt * 22);

    for (var p = parts.length - 1; p >= 0; p--) {
      var q = parts[p];
      q.life -= dt; q.vy += 420 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.life <= 0) parts.splice(p, 1);
    }
    if (flash > 0) flash = Math.max(0, flash - dt * 2.5);
    if (state !== 'play') return;

    elapsed += dt;
    var wnd = windNow();
    for (var k = 0; k < streaks.length; k++) {
      var sk = streaks[k];
      sk.x += (wnd / W) * dt * 2.2;
      if (sk.x > 1.1) sk.x = -0.1;
      if (sk.x < -0.1) sk.x = 1.1;
    }

    spawnT -= dt;
    if (spawnT <= 0) {
      spawn();
      var gap = lv.endless ? Math.max(0.36, 0.95 - elapsed * 0.012) : Math.max(0.4, (0.95 - elapsed * 0.006) / (1 + (lv.speed - 1) * 0.6));
      spawnT = gap * rand(0.8, 1.15);
    }

    if (lv.gulls) {
      gullT -= dt;
      if (gullT <= 0) {
        var dir = Math.random() < 0.5 ? 1 : -1;
        gulls.push({ x: dir > 0 ? -30 : W + 30, y: rand(H * 0.22, H * 0.55), vx: dir * rand(150, 210), t: 0 });
        gullT = rand(4.5, 7.5);
      }
    }
    for (var gi = gulls.length - 1; gi >= 0; gi--) {
      var g = gulls[gi];
      g.x += g.vx * dt; g.t += dt;
      if (g.x < -60 || g.x > W + 60) gulls.splice(gi, 1);
    }

    for (var i = items.length - 1; i >= 0; i--) {
      var it = items[i];
      it.y += it.vy * dt;
      it.x = clamp(it.x + wnd * dt, it.r, W - it.r);
      it.rot += it.spin * dt;

      var stolen = false;
      if (it.kind !== 'burnt') {
        for (var g2 = 0; g2 < gulls.length; g2++) {
          var gg = gulls[g2];
          if (Math.abs(it.x - gg.x) < 28 && Math.abs(it.y - gg.y) < 24) { stolen = true; break; }
        }
      }
      if (stolen) {
        burst(it.x, it.y, '#f7f4ec', 7);
        tone(900, 0.08, 'square', 0.04);
        items.splice(i, 1);
        if (streak > 0) { streak = 0; mult = 1; setCombo(); }
        continue;
      }

      var top = tray.y;
      var hit = it.y + it.r * 0.9 >= top && it.y < top + tray.h && Math.abs(it.x - tray.x) < tray.w / 2 + it.r * 0.35;
      if (hit) {
        items.splice(i, 1);
        if (it.kind === 'burnt') {
          lives -= 1; streak = 0; mult = 1; flash = 1;
          burst(it.x, top, '#ff6a45', 16);
          setLives(); setCombo();
          tone(140, 0.25, 'sawtooth', 0.08);
          if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
          if (lives <= 0) { if (lv.endless) endEndless(); else loseLevel(); return; }
        } else {
          streak += 1;
          mult = Math.min(4, 1 + Math.floor(streak / 5));
          setScore(score + (it.kind === 'gold' ? 5 : 1) * mult);
          burst(it.x, top, it.kind === 'gold' ? '#ffe28a' : '#fbeec4', it.kind === 'gold' ? 14 : 8);
          setCombo();
          if (it.kind === 'gold') { tone(784, 0.1, 'triangle', 0.08); tone(1047, 0.18, 'triangle', 0.08, 0.08); }
          else tone(520 + mult * 70, 0.09, 'triangle', 0.07);
          if (!lv.endless && score >= lv.goal) { winLevel(); return; }
        }
      } else if (it.y - it.r > H) {
        items.splice(i, 1);
        if (it.kind !== 'burnt' && streak > 0) { streak = 0; mult = 1; setCombo(); }
      }
    }
  }

  function frame(ts) {
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
    last = ts;
    if (W) { update(dt); draw(); }
    requestAnimationFrame(frame);
  }

  /* ---------- input ---------- */
  function pointerX(e) {
    var r = cv.getBoundingClientRect();
    tray.target = clamp(e.clientX - r.left, tray.w / 2, W - tray.w / 2);
  }
  cv.addEventListener('pointerdown', function (e) {
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    pointerX(e);
  });
  cv.addEventListener('pointermove', pointerX);
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'ArrowRight') keys.right = true;
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
  });

  $('menuBtn').addEventListener('click', showMenu);
  $('endlessBtn').addEventListener('click', function () { ac(); startEndless(); });
  $('soundBtn').addEventListener('click', function () {
    soundOn = !soundOn;
    try { localStorage.setItem('simit-sound', soundOn ? 'on' : 'off'); } catch (e) {}
    $('soundBtn').textContent = 'Ses: ' + (soundOn ? 'açık' : 'kapalı');
    if (soundOn) { ac(); tone(660, 0.1, 'triangle', 0.07); }
  });

  resize();
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
