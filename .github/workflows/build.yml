name: APK olustur
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Zip dosyasini ac
        run: unzip -q ./*.zip
      - name: Guncel oyun dosyasini kullan
        run: |
          if [ -f game.html ]; then cp game.html simit-yagmuru-app/src/game.html; fi
      - name: Paketleri kur
        working-directory: simit-yagmuru-app
        run: |
          npm install @capacitor/core @capacitor/android @fontsource/bricolage-grotesque @fontsource/figtree
          npm install --save-dev @capacitor/cli @capacitor/assets
      - name: Android projesini hazirla
        working-directory: simit-yagmuru-app
        run: npm run setup
      - name: APK derle
        working-directory: simit-yagmuru-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: simit-yagmuru-apk
          path: simit-yagmuru-app/android/app/build/outputs/apk/debug/app-debug.apk
